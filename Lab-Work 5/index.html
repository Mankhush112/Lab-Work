<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <body bgcolor="pink"></body>
</head>

<body>

    <h1 align="center">Blood report</h1>
    
    <form>

        <fieldset>
            <legend><b>Donor Information</b></legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br><br>

            <label for="blood">Blood Group:</label>
            <select id="blood" name="blood" required>
                <option value="">-- Select Blood Group --</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>
            <br><br>

            <label for="phone">Mobile Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="address">Address:</label>
            <br>
            <textarea id="address" name="address" rows="4" cols="40"></textarea>
            <br><br>

            <label for="date">Preferred Donation Date:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label>
                <input type="checkbox" required>
                I confirm that the information provided is correct.
            </label>
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Reset">

        </fieldset>
